<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect x="25" y="20" width="800" height="400" rx="10" fill="#181824" stroke="#2a2a3c" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Window Header -->
  <path d="M 25 30 Q 25 20 35 20 L 815 20 Q 825 20 825 30 L 825 58 L 25 58 Z" fill="#1f1f2e" />
  <circle cx="48" cy="39" r="6" fill="#ff5f56" />
  <circle cx="68" cy="39" r="6" fill="#ffbd2e" />
  <circle cx="88" cy="39" r="6" fill="#27c93f" />
  <text x="425" y="44" fill="#a0a0b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" font-weight="500">
    COMMIT_EDITMSG — Soạn thảo thông điệp cho Commit sau khi gộp (Squash)
  </text>
  <line x1="25" y1="58" x2="825" y2="58" stroke="#2a2a3c" stroke-width="1" />

  <!-- Terminal Content -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" line-height="1.5">
    <!-- Active Commit Message -->
    <rect x="45" y="78" width="550" height="28" fill="#264f78" rx="4" />
    <text x="55" y="97" fill="#ffffff" font-weight="bold">feat: hoan thien module authentication</text>

    <!-- Git Explanations / Comments -->
    <text x="50" y="140" fill="#6a9955"># Please enter the commit message for your changes. Lines starting</text>
    <text x="50" y="160" fill="#6a9955"># with '#' will be ignored, and an empty message aborts the commit.</text>
    <text x="50" y="180" fill="#6a9955">#</text>
    <text x="50" y="200" fill="#6a9955"># Date:      Mon Oct 5 19:50:34 2026 +0700</text>
    <text x="50" y="220" fill="#6a9955">#</text>
    <text x="50" y="240" fill="#6a9955"># On branch feature/authentication</text>
    <text x="50" y="260" fill="#6a9955"># Changes to be committed:</text>
    <text x="50" y="280">
      <tspan fill="#4ec9b0">#	new file:   </tspan>
      <tspan fill="#ce9178">auth.js</tspan>
    </text>
    <text x="50" y="300">
      <tspan fill="#4ec9b0">#	new file:   </tspan>
      <tspan fill="#ce9178">homework/session_05/ex2/auth.js</tspan>
    </text>
    <text x="50" y="330" fill="#dcdcaa"># (Commit temp.txt da bi drop, khong xuat hien trong commit nay)</text>
  </g>

  <!-- Status Bar -->
  <rect x="25" y="385" width="800" height="35" rx="0" fill="#252538" />
  <text x="50" y="408" fill="#4ec9b0" font-family="monospace" font-size="12" font-weight="bold">INSERT</text>
  <text x="130" y="408" fill="#808080" font-family="monospace" font-size="12">.git/COMMIT_EDITMSG</text>
  <text x="740" y="408" fill="#dcdcaa" font-family="monospace" font-size="12">utf-8 [unix]</text>
</svg>
