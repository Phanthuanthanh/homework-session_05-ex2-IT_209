<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="850" height="480">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect x="25" y="20" width="800" height="440" rx="10" fill="#181824" stroke="#2a2a3c" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Window Header -->
  <path d="M 25 30 Q 25 20 35 20 L 815 20 Q 825 20 825 30 L 825 58 L 25 58 Z" fill="#1f1f2e" />
  <circle cx="48" cy="39" r="6" fill="#ff5f56" />
  <circle cx="68" cy="39" r="6" fill="#ffbd2e" />
  <circle cx="88" cy="39" r="6" fill="#27c93f" />
  <text x="425" y="44" fill="#a0a0b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" font-weight="500">
    git-rebase-todo — Interactive Rebase Configuration (git rebase -i HEAD~4)
  </text>
  <line x1="25" y1="58" x2="825" y2="58" stroke="#2a2a3c" stroke-width="1" />

  <!-- Terminal Content -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" line-height="1.5">
    <!-- Rebase actions -->
    <text x="50" y="90">
      <tspan fill="#4ec9b0" font-weight="bold">pick</tspan>
      <tspan fill="#dcdcaa"> 163c447</tspan>
      <tspan fill="#ce9178"> feat: khoi tao module auth</tspan>
    </text>
    <text x="50" y="115">
      <tspan fill="#dcdcaa" font-weight="bold">squash</tspan>
      <tspan fill="#dcdcaa"> 27accc4</tspan>
      <tspan fill="#9cdcfe"> fix typo</tspan>
      <tspan fill="#6a9955">  # &lt;-- gop vao commit 163c447</tspan>
    </text>
    <text x="50" y="140">
      <tspan fill="#dcdcaa" font-weight="bold">squash</tspan>
      <tspan fill="#dcdcaa"> 9d29146</tspan>
      <tspan fill="#9cdcfe"> adds utility functions</tspan>
      <tspan fill="#6a9955">  # &lt;-- gop tiep vao commit 163c447</tspan>
    </text>
    <text x="50" y="165">
      <tspan fill="#f14c4c" font-weight="bold">drop</tspan>
      <tspan fill="#dcdcaa"> 9fbca85</tspan>
      <tspan fill="#808080"> add temp file for debug</tspan>
      <tspan fill="#f14c4c">  # &lt;-- XOA BO HOAN TOAN COMMIT NAY</tspan>
    </text>

    <!-- Git Help Comments -->
    <text x="50" y="205" fill="#6a9955"># Rebase 37e2fd2..9fbca85 onto 37e2fd2 (4 commands)</text>
    <text x="50" y="225" fill="#6a9955">#</text>
    <text x="50" y="245" fill="#6a9955"># Commands:</text>
    <text x="50" y="265" fill="#6a9955"># p, pick &lt;commit&gt; = use commit</text>
    <text x="50" y="285" fill="#6a9955"># r, reword &lt;commit&gt; = use commit, but edit the commit message</text>
    <text x="50" y="305" fill="#6a9955"># e, edit &lt;commit&gt; = use commit, but stop for amending</text>
    <text x="50" y="325" fill="#6a9955"># s, squash &lt;commit&gt; = use commit, but meld into previous commit</text>
    <text x="50" y="345" fill="#6a9955"># f, fixup [-C | -c] &lt;commit&gt; = like "squash" but keep only previous log</text>
    <text x="50" y="365" fill="#6a9955"># d, drop &lt;commit&gt; = remove commit</text>
    <text x="50" y="385" fill="#6a9955">#</text>
    <text x="50" y="405" fill="#6a9955"># If you remove a line here THAT COMMIT WILL BE LOST.</text>
  </g>

  <!-- Status Bar -->
  <rect x="25" y="425" width="800" height="35" rx="0" fill="#252538" />
  <text x="50" y="448" fill="#4ec9b0" font-family="monospace" font-size="12" font-weight="bold">NORMAL</text>
  <text x="130" y="448" fill="#808080" font-family="monospace" font-size="12">.git/rebase-merge/git-rebase-todo</text>
  <text x="760" y="448" fill="#dcdcaa" font-family="monospace" font-size="12">4/4 lines</text>
</svg>
